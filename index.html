<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wokół mnie</title>
  <meta name="description" content="Co ciekawego jest kilkaset metrów od ciebie? Karty z polskiej Wikipedii o miejscach w twojej okolicy.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0f0e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Wokół mnie">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Display face loaded without blocking first paint; Georgia / system serif until it arrives. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"></noscript>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-compass" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="22" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="1.5"/>
      <circle cx="32" cy="32" r="14" fill="none" stroke="currentColor" stroke-opacity=".2" stroke-width="1"/>
      <path d="M32 7v4M32 53v4M7 32h4M53 32h4" stroke="currentColor" stroke-opacity=".8" stroke-width="2" stroke-linecap="round"/>
      <g transform="rotate(34 32 32)">
        <path d="M32 13 L37.2 32 L26.8 32 Z" fill="var(--accent)"/>
        <path d="M32 51 L26.8 32 L37.2 32 Z" fill="currentColor"/>
      </g>
      <circle cx="32" cy="32" r="3.2" fill="var(--bg)" stroke="currentColor" stroke-width="1.5"/>
    </symbol>
    <symbol id="i-needle" viewBox="0 0 24 24">
      <path d="M12 2 L15.2 12 L8.8 12 Z" fill="currentColor"/>
      <path d="M12 22 L8.8 12 L15.2 12 Z" fill="currentColor" fill-opacity=".45"/>
    </symbol>
    <symbol id="i-pin" viewBox="0 0 24 24">
      <path d="M12 21s-6-5.6-6-11a6 6 0 0 1 12 0c0 5.4-6 11-6 11Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="12" cy="10" r="2.2" fill="currentColor"/>
    </symbol>
    <symbol id="i-external" viewBox="0 0 24 24">
      <path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-route" viewBox="0 0 24 24">
      <circle cx="6" cy="19" r="2.2" fill="currentColor"/>
      <path d="M6 16.5V11a4 4 0 0 1 4-4h8.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M15.5 3.5 19 7l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24">
      <path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-x" viewBox="0 0 24 24">
      <path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-share" viewBox="0 0 24 24">
      <path d="M12 15V4M8 8l4-4 4 4M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-back" viewBox="0 0 24 24">
      <path d="M11 5l-7 7 7 7M4 12h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24">
      <path d="M6 9.5l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-redo" viewBox="0 0 24 24">
      <path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M16 16l4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-alert" viewBox="0 0 24 24">
      <path d="M12 3l10 18H2L12 3Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <path d="M12 10v5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <circle cx="12" cy="18" r="1.2" fill="currentColor"/>
    </symbol>
    <symbol id="i-empty" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3"/>
      <circle cx="12" cy="12" r="2" fill="currentColor"/>
    </symbol>
  </svg>

  <main class="app" id="app">
    <!-- Ekran startowy -->
    <section class="screen screen-start" data-testid="start-screen" id="start-screen">
      <div class="start-rings" aria-hidden="true"></div>
      <div class="start-inner">
        <svg class="start-compass" aria-hidden="true"><use href="#i-compass"/></svg>
        <p class="eyebrow">Przewodnik terenowy</p>
        <h1 class="start-title">Wokół mnie</h1>
        <p class="start-lead">Co ciekawego jest kilkaset metrów od ciebie? Przesuwaj karty i sprawdź, ile wiesz o swojej okolicy.</p>

        <div class="radius-block">
          <span class="field-label" id="radius-label">Promień</span>
          <div class="chips-slot" id="start-chips-slot"></div>
        </div>

        <button type="button" class="btn btn-primary btn-xl" data-testid="start-button" id="start-button">
          <svg class="icon" aria-hidden="true"><use href="#i-needle"/></svg>
          <span>Pokaż, co jest wokół</span>
        </button>

        <p class="note note-alert" id="geo-message" role="alert" hidden></p>

        <button type="button" class="btn-text" id="place-toggle" aria-expanded="false" aria-controls="place-form">Nie masz GPS? Wpisz miejsce ręcznie</button>

        <form class="place-form" id="place-form" hidden novalidate>
          <label class="field-label" for="place-input">Wpisz miejsce (np. Rynek Główny, Kraków)</label>
          <div class="place-row">
            <input class="input" id="place-input" data-testid="place-input" name="place" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" spellcheck="false" placeholder="Rynek Główny, Kraków">
            <button type="submit" class="btn btn-primary btn-icon" id="place-submit" data-testid="place-submit" aria-label="Szukaj miejsca">
              <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
            </button>
          </div>
          <p class="note note-alert" id="place-message" role="alert" hidden></p>
        </form>
      </div>
      <p class="start-foot">Treści i zdjęcia: polska Wikipedia (CC BY-SA)</p>
    </section>

    <!-- Widok „wokół”: pasek, stany oraz feed kart -->
    <section class="screen screen-around" id="around-screen" hidden>
      <header class="topbar" id="topbar">
        <div class="topbar-row">
          <p class="progress" data-testid="progress" id="progress" aria-live="polite"></p>
          <button type="button" class="btn-ghost" data-testid="change-place" id="change-place" aria-label="Zmień miejsce">
            <svg class="icon" aria-hidden="true"><use href="#i-back"/></svg>
            <span>Zmień miejsce</span>
          </button>
        </div>
        <div class="chips-slot chips-slot-bar" id="bar-chips-slot"></div>
      </header>

      <div class="status" id="loading-state" role="status" hidden>
        <svg class="status-icon spinner" aria-hidden="true"><use href="#i-compass"/></svg>
        <p class="status-text" id="loading-text">Szukam miejsc wokół ciebie…</p>
      </div>

      <div class="status" data-testid="empty-state" id="empty-state" hidden>
        <svg class="status-icon" aria-hidden="true"><use href="#i-empty"/></svg>
        <h2 class="status-title">Tu jest pusto</h2>
        <p class="status-text" id="empty-text"></p>
        <div class="chips-slot" id="empty-chips-slot"></div>
      </div>

      <div class="status" data-testid="error-state" id="error-state" role="alert" hidden>
        <svg class="status-icon" aria-hidden="true"><use href="#i-alert"/></svg>
        <h2 class="status-title" id="error-title">Nie udało się pobrać danych</h2>
        <p class="status-text" id="error-text"></p>
        <button type="button" class="btn btn-primary" data-testid="retry-button" id="retry-button">
          <svg class="icon" aria-hidden="true"><use href="#i-redo"/></svg>
          <span>Spróbuj ponownie</span>
        </button>
      </div>

      <div class="feed" data-testid="feed" id="feed" role="feed" aria-label="Karty miejsc" hidden></div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <noscript><p class="noscript">Ta aplikacja potrzebuje włączonego JavaScriptu.</p></noscript>

  <!-- Karta miejsca -->
  <template id="card-template">
    <article class="card" data-testid="card" tabindex="-1">
      <div class="card-media" aria-hidden="true">
        <div class="card-placeholder"><span class="card-letter"></span></div>
        <img class="card-photo" alt="" decoding="async" hidden>
      </div>
      <div class="card-shade" aria-hidden="true"></div>
      <div class="swipe-label swipe-label-known" aria-hidden="true">Wiedziałem</div>
      <div class="swipe-label swipe-label-unknown" aria-hidden="true">Nie wiedziałem</div>
      <div class="card-stamp" aria-hidden="true"><span class="card-stamp-text"></span></div>
      <div class="card-body">
        <p class="card-distance" data-testid="card-distance">
          <svg class="icon" aria-hidden="true"><use href="#i-pin"/></svg>
          <span class="card-distance-text"></span>
        </p>
        <h2 class="card-title" data-testid="card-title"></h2>
        <p class="card-extract" data-testid="card-extract"></p>
        <p class="card-detail-error" hidden>
          <span>Nie udało się pobrać opisu.</span>
          <button type="button" class="btn-text card-retry">Spróbuj ponownie</button>
        </p>
        <div class="card-links">
          <a class="pill-link card-link" target="_blank" rel="noopener noreferrer">
            <svg class="icon" aria-hidden="true"><use href="#i-external"/></svg>
            <span>Czytaj w Wikipedii</span>
          </a>
          <a class="pill-link card-navigate" data-testid="card-navigate" target="_blank" rel="noopener noreferrer">
            <svg class="icon" aria-hidden="true"><use href="#i-route"/></svg>
            <span>Nawiguj</span>
          </a>
        </div>
        <div class="card-actions">
          <button type="button" class="btn btn-secondary btn-answer" data-testid="btn-unknown" data-known="false">
            <svg class="icon" aria-hidden="true"><use href="#i-x"/></svg>
            <span>Nie wiedziałem</span>
          </button>
          <button type="button" class="btn btn-primary btn-answer" data-testid="btn-known" data-known="true">
            <svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>
            <span>Wiedziałem</span>
          </button>
        </div>
      </div>
    </article>
  </template>

  <!-- Karta pierścienia: podsumowanie promienia między pierścieniami -->
  <template id="ring-template">
    <section class="card card-summary card-ring" data-testid="ring-card" tabindex="-1">
      <div class="summary-inner">
        <p class="eyebrow ring-eyebrow"></p>
        <div class="end-meter end-meter-sm" role="img">
          <svg class="end-ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="end-ring-track" cx="60" cy="60" r="52"/>
            <circle class="end-ring-value" cx="60" cy="60" r="52" pathLength="100"/>
          </svg>
          <p class="end-percent"><span class="end-percent-num"></span><span class="end-percent-sign">%</span></p>
        </div>
        <h2 class="ring-title"></h2>
        <p class="ring-score"></p>
        <button type="button" class="btn btn-primary ring-share" data-testid="ring-share">
          <svg class="icon" aria-hidden="true"><use href="#i-share"/></svg>
          <span>Udostępnij</span>
        </button>
      </div>
      <p class="ring-next">
        <span class="ring-next-text"></span>
        <svg class="icon ring-chevron" aria-hidden="true"><use href="#i-chevron-down"/></svg>
      </p>
    </section>
  </template>

  <!-- Ogon feedu: ładowanie następnego pierścienia albo błąd z ponowieniem -->
  <template id="tail-template">
    <section class="card card-summary card-tail" data-testid="loading-card" aria-label="Ładowanie dalszych miejsc" tabindex="-1">
      <div class="summary-inner">
        <div class="tail-loading" role="status">
          <svg class="status-icon spinner" aria-hidden="true"><use href="#i-compass"/></svg>
          <p class="status-text tail-loading-text"></p>
        </div>
        <div class="tail-error" data-testid="ring-error" role="alert" hidden>
          <svg class="status-icon" aria-hidden="true"><use href="#i-alert"/></svg>
          <h2 class="status-title">Nie udało się pobrać dalszych miejsc</h2>
          <p class="status-text tail-error-text"></p>
          <button type="button" class="btn btn-primary tail-retry" data-testid="ring-retry">
            <svg class="icon" aria-hidden="true"><use href="#i-redo"/></svg>
            <span>Spróbuj ponownie</span>
          </button>
        </div>
      </div>
    </section>
  </template>

  <!-- Karta końcowa po ostatnim pierścieniu (10 km) -->
  <template id="end-template">
    <section class="card card-summary card-end" data-testid="end-card" aria-label="Wynik" tabindex="-1">
      <div class="summary-inner">
        <div class="end-meter" role="img">
          <svg class="end-ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="end-ring-track" cx="60" cy="60" r="52"/>
            <circle class="end-ring-value" cx="60" cy="60" r="52" pathLength="100"/>
          </svg>
          <p class="end-percent"><span class="end-percent-num"></span><span class="end-percent-sign">%</span></p>
        </div>
        <h2 class="end-title"></h2>
        <p class="end-sub"></p>
        <div class="end-actions">
          <button type="button" class="btn btn-primary" data-testid="share-button">
            <svg class="icon" aria-hidden="true"><use href="#i-share"/></svg>
            <span>Udostępnij</span>
          </button>
          <button type="button" class="btn btn-secondary end-change">
            <svg class="icon" aria-hidden="true"><use href="#i-back"/></svg>
            <span>Zmień miejsce</span>
          </button>
          <button type="button" class="btn btn-secondary end-again">
            <svg class="icon" aria-hidden="true"><use href="#i-redo"/></svg>
            <span>Jeszcze raz</span>
          </button>
        </div>
      </div>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
